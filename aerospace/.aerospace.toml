# Core startup and normalization settings
config-version = 2
start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

# Focus-change hooks
on-focus-changed = [
  'move-mouse window-lazy-center',
  'exec-and-forget /opt/homebrew/bin/sketchybar --trigger windows_on_spaces'
]
automatically-unhide-macos-hidden-apps = false
persistent-workspaces = ['W̲eb', 'Note̲', 'C̲omm', 'A̲I', 'D̲ev', 'R̲ead', 'M̲usic']

# Workspace-change hooks
exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED=$AEROSPACE_FOCUSED_WORKSPACE PREV=$AEROSPACE_PREV_WORKSPACE'
]

# Startup hooks
after-startup-command = [
  'exec-and-forget /bin/bash -c "/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED=$(aerospace list-workspaces --focused | head -n 1); /opt/homebrew/bin/sketchybar --trigger windows_on_spaces"',
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]

# Exec environment
[exec]
inherit-env-vars = true

# Shell PATH
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

# Window gaps
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.top = [{ monitor."DELL" = 40 }, {monitor."MAG" = 40}, 8]
outer.bottom = 4
outer.left = 4
outer.right = 4

[[on-window-detected]]
check-further-callbacks = true
run = 'exec-and-forget /opt/homebrew/bin/sketchybar --trigger windows_on_spaces'

# Route newly detected windows only: manual moves persist until a new window opens.
# Continue into the original floating rules below without changing their layouts.
[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(company[.]thebrowser[.]dia)$"'
check-further-callbacks = true
run = 'move-node-to-workspace --focus-follows-window W̲eb'

[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(md[.]obsidian|notion[.]id|com[.]apple[.]Notes)$"'
check-further-callbacks = true
run = 'move-node-to-workspace --focus-follows-window Note̲'

[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com[.]tinyspeck[.]slackmacgap|com[.]kakao[.]KakaoTalkMac|com[.]apple[.]iCal)$"'
check-further-callbacks = true
run = 'move-node-to-workspace --focus-follows-window C̲omm'

[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com[.]openai[.]chat|com[.]openai[.]codex|com[.]anthropic[.]claudefordesktop)$"'
check-further-callbacks = true
run = 'move-node-to-workspace --focus-follows-window A̲I'

[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com[.]microsoft[.]VSCode|com[.]mitchellh[.]ghostty)$"'
check-further-callbacks = true
run = 'move-node-to-workspace --focus-follows-window D̲ev'

[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com[.]apple[.]Preview|org[.]zotero[.]zotero)$"'
check-further-callbacks = true
run = 'move-node-to-workspace --focus-follows-window R̲ead'

[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com[.]spotify[.]client)$"'
check-further-callbacks = true
run = 'move-node-to-workspace --focus-follows-window M̲usic'

# Unassigned apps default to Z1; workspace Z2 is available for manual grouping.
[[on-window-detected]]
if = 'test-not %{app-bundle-id} ~= "^(company[.]thebrowser[.]dia|md[.]obsidian|notion[.]id|com[.]apple[.]Notes|com[.]tinyspeck[.]slackmacgap|com[.]kakao[.]KakaoTalkMac|com[.]apple[.]iCal|com[.]openai[.]chat|com[.]openai[.]codex|com[.]anthropic[.]claudefordesktop|com[.]microsoft[.]VSCode|com[.]mitchellh[.]ghostty|com[.]apple[.]Preview|com[.]spotify[.]client|org[.]zotero[.]zotero))$"'
check-further-callbacks = true
run = 'move-node-to-workspace --focus-follows-window Z1'

[[on-window-detected]]
if.app-name-regex-substring = 'System Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Finder'
if.window-title-regex-substring = 'Co(py|nnect)|Move|Info|Pref'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Safari'
if.window-title-regex-substring = '^(General|(Tab|Password|Website|Extension)s|AutoFill|Se(arch|curity)|Privacy|Advance)$'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'App Store'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Activity Monitor'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Dictionary'
run = 'layout floating'

[[on-window-detected]]
if.window-title-regex-substring = '^Software Update$'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'System Information'
if.window-title-regex-substring = '^About This Mac$'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.kakao.KakaoTalkMac'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Keka'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'AppCleaner'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Photo Booth'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'FaceTime'
run = 'layout floating'

# Main key bindings
[mode.main.binding]
alt-enter = 'exec-and-forget open -na Ghostty'

# Focus movement
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'swap left'
alt-shift-j = 'swap down'
alt-shift-k = 'swap up'
alt-shift-l = 'swap right'

# Window joins
alt-shift-cmd-h = 'join-with left'
alt-shift-cmd-j = 'join-with down'
alt-shift-cmd-k = 'join-with up'
alt-shift-cmd-l = 'join-with right'

# Workspace keys: W=W̲eb, E=Note̲, C=C̲omm, A=A̲I, D=D̲ev, R=R̲ead, M=Music.
# Move a window and follow it (reload-config uses ctrl-alt-r).
alt-shift-w = 'move-node-to-workspace --focus-follows-window W̲eb'
alt-shift-e = 'move-node-to-workspace --focus-follows-window Note̲'
alt-shift-c = 'move-node-to-workspace --focus-follows-window C̲omm'
alt-shift-a = 'move-node-to-workspace --focus-follows-window A̲I'
alt-shift-d = 'move-node-to-workspace --focus-follows-window D̲ev'
alt-shift-r = 'move-node-to-workspace --focus-follows-window R̲ead'
alt-shift-m = 'move-node-to-workspace --focus-follows-window M̲usic'
alt-shift-1 = 'move-node-to-workspace --focus-follows-window Z1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window Z2'

# Workspace switching; existing previous/next navigation stays unchanged.
alt-cmd-z = 'workspace prev'
alt-cmd-x = 'workspace next'
alt-cmd-w = 'workspace W̲eb'
alt-cmd-e = 'workspace Note̲'
alt-cmd-c = 'workspace C̲omm'
alt-cmd-a = 'workspace A̲I'
alt-cmd-d = 'workspace D̲ev'
alt-cmd-r = 'workspace R̲ead'
alt-cmd-m = 'workspace M̲usic'
alt-cmd-1 = 'workspace Z1'
alt-cmd-2 = 'workspace Z2'

# Summon workspaces
alt-cmd-shift-w = 'summon-workspace W̲eb'
alt-cmd-shift-e = 'summon-workspace Note̲'
alt-cmd-shift-c = 'summon-workspace C̲omm'
alt-cmd-shift-a = 'summon-workspace A̲I'
alt-cmd-shift-d = 'summon-workspace D̲ev'
alt-cmd-shift-r = 'summon-workspace R̲ead'
alt-cmd-shift-m = 'summon-workspace M̲usic'
alt-cmd-shift-1 = 'summon-workspace Z1'
alt-cmd-shift-2 = 'summon-workspace Z2'

# Resize and balance
ctrl-alt-minus = 'resize smart -50'
ctrl-alt-equal = 'resize smart +50'
ctrl-alt-e = 'balance-sizes'

# Layout maintenance
alt-r = 'flatten-workspace-tree'
ctrl-alt-r = 'reload-config'
alt-x = 'layout horizontal'
alt-y = 'layout vertical'

# Floating and fullscreen toggles
alt-shift-space = [
  'layout floating tiling',
  'exec-and-forget /bin/bash -c "sketchybar --trigger window_focus"'
]

alt-f = [
  'fullscreen',
  'exec-and-forget /bin/bash -c "sketchybar --trigger window_focus"'
]
alt-shift-f = 'macos-native-fullscreen'

# Miscellaneous workspace controls
alt-comma = 'layout tiles accordion'
alt-tab = 'workspace-back-and-forth'
# Move the current workspace to the next display, wrapping after the last display.
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
